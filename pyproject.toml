[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "haggle-agent"
version = "0.1.0"
description = "An agent that negotiates the price for you."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "eliem08" }]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: Other/Proprietary License",
  "Operating System :: OS Independent",
  "Private :: Do Not Upload",
]

[project.optional-dependencies]
dev = ["ruff>=0.6"]

[project.scripts]
haggle-agent = "haggle_agent.__main__:main"
haggle-agent-web = "haggle_agent.web:main"

[project.urls]
Repository = "https://github.com/eliem08/haggle-agent"

[tool.setuptools]
packages = ["haggle_agent"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I", "SIM", "RUF"]
ignore = ["E501", "E741", "SIM108", "RUF001", "RUF002", "RUF003", "RUF022", "B905"]  # E501: ruff format owns line length

[tool.ruff.lint.per-file-ignores]
"haggle_agent/__init__.py" = ["F401", "F403"]
"tests/*" = ["E501"]
